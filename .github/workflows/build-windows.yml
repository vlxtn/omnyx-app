name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download latest companion installer
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/vlxtn/omnyx-desktop/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -like "*.exe" -and $_.name -notlike "*.blockmap" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "companion-setup.exe" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          Write-Host "Downloaded companion: $($asset.name)"
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows app
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnyx-windows
          path: dist/Omnyx-Setup.exe
