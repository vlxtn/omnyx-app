name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download latest companion installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.COMPANION_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/vlxtn/omnyx-desktop/releases/latest" -Headers $headers
          Write-Host "Latest release: $($release.tag_name)"
          $asset = $release.assets | Where-Object { $_.name -eq "Omnyx-Setup.exe" } | Select-Object -First 1
          if (-not $asset) { Write-Error "Asset Omnyx-Setup.exe not found"; exit 1 }
          Write-Host "Downloading: $($asset.browser_download_url)"
          curl.exe -L -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -o companion-setup.exe $asset.url
          $size = (Get-Item companion-setup.exe -ErrorAction SilentlyContinue).Length
          Write-Host "companion-setup.exe: $size bytes"
          if (-not $size -or $size -lt 10000) { Write-Error "File too small or missing"; exit 1 }

      - name: Publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Publish Mac
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
