name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Download latest companion installer
        shell: pwsh
        run: |
          try {
            $url = "https://github.com/vlxtn/omnyx-desktop/releases/latest/download/Omnyx-Setup.exe"
            Invoke-WebRequest -Uri $url -OutFile companion-setup.exe -UseBasicParsing
            $size = (Get-Item companion-setup.exe).Length
            Write-Host "companion-setup.exe downloaded: $size bytes"
          } catch {
            Write-Host "Download failed, creating placeholder"
            [System.IO.File]::WriteAllBytes("companion-setup.exe", @())
          }

      - name: Publish Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Publish Mac
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
